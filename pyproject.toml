[project]
name = "motion-lab"
version = "0.1.0"
description = "Reproducible robotics control and dynamics experiments in MuJoCo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio==2.38.1",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.2",
    "mujoco==3.16.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["experiments/01-feedback-control/tests"]
