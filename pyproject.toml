[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "motion-lab"
version = "0.1.0"
description = "Reproducible robotics control and dynamics experiments in MuJoCo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio==2.38.1",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.2",
    "mujoco==3.16.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "experiments/01-feedback-control/tests",
    "experiments/02-state-transition-dataset/tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "experiments/01-feedback-control/src/feedback_control",
    "experiments/02-state-transition-dataset/src/state_transition_dataset",
]
